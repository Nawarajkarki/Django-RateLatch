name: Tests

on:
  push:
    branches: [master] # Change to main if that's your default branch
  pull_request:
    branches: [master] # Match the branch you merge into

permissions:
  contents: read

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      RATE_LIMITER_REDIS_URL: redis://localhost:6379/0
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            django-version: "Django>=5.2,<5.3"
          - python-version: "3.12"
            django-version: "Django>=5.2,<5.3"
          - python-version: "3.12"
            django-version: "Django>=6.1,<6.2"
          - python-version: "3.13"
            django-version: "Django>=5.2,<5.3"
          - python-version: "3.13"
            django-version: "Django>=6.1,<6.2"
          - python-version: "3.14"
            django-version: "Django>=5.2,<5.3"
          - python-version: "3.14"
            django-version: "Django>=6.1,<6.2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: >-
          uv pip install --system -e ".[redis,drf]"
          "${{ matrix.django-version }}"
          pytest pytest-django

      - name: Run tests
        run: python -m pytest