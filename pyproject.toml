[project]
name = "django-ratelimiter"
version = "0.1.0"
description = "Django rate limiting middleware and decorators with fixed-window and sliding-window counter algorithms, backed by in-memory storage or Redis."
readme = "README.md"
authors = [
    { name = "Nawaraj karki", email = "nawarajkarkee404@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
]
[project.optional-dependencies]
redis = ["redis>=8.1.0"]
drf = ["djangorestframework"]
[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "djangorestframework>=3.18.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "redis>=8.1.0",
]
