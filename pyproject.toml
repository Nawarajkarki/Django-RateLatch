[project]
name = "django-ratelatch"
version = "0.1.0"
description = "Django rate-limiting library with middleware, view decorators, and Django REST Framework throttling. Supports fixed-window, sliding-window counter, and token-bucket algorithms with in-memory or Redis storage."
readme = "README.md"
authors = [
    { name = "Nawaraj karki", email = "nawarajkarkee404@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2",
]
[project.optional-dependencies]
redis = ["redis>=8.1.0"]
drf = ["djangorestframework"]
[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "djangorestframework>=3.18.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "redis>=8.1.0",
]
